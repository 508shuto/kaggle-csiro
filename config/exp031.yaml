experiment:
  name: exp031
  seed: 42

dataset:
  input_dir: ./input
  output_dir: ./output
  n_folds: 5
  shuffle: true

model:
  name: "vit_large_patch16_dinov3.lvd1689m"
  pretrained: true
  in_channels: 3
  freeze_backbone: true
  # Tile処理設定
  use_tile: true
  tile_grid: 2  # 2×2 grid
  gem_p: 3.0    # GeM pooling初期値
  # MHA fusion設定
  use_mha_fusion: true
  mha_dim: 256
  mha_heads: 4
  mha_dropout: 0.1

loss:
  name: "smooth_l1_loss"
  params: {}

aux_loss:
  name: "aux_loss"
  params: {}
  weight: 0.1

trainer:
  train:
    epochs: 100
    warmup_epochs: 3
    batch_size: 16
    num_workers: 4
    pin_memory: true
    drop_last: true
    prefetch_factor: 2
    patience: null
    device_type: "auto"
    devices: 1
    precision: "16-mixed"
    accumulate_grad_batches: 1
    val_check_interval: 1.0
    strategy: "auto"
    deterministic: true
    optimizer:
      opt: "adamw"
      lr: 1e-3  # ヘッドのみ学習なのでlrを上げる
      weight_decay: 1e-2
      betas: [0.9, 0.999]
      eps: 1e-8
      amsgrad: false
    scheduler:
      sched: "cosine"
    ema:
      decay: 0.995
      update_after_step: 0
    use_wandb: true
  valid:
    batch_size: 32
    num_workers: 4
    pin_memory: false
    drop_last: false
    prefetch_factor: 2

# Augmentation簡素化: HFlip, VFlip, BrightnessContrastのみ
augmentation:
  train:
    image_size: 512
    horizontal_flip: 0.5
    vertical_flip: 0.5
    brightness_contrast: true
    # 以下すべて無効化
    rotation_limit: 0
    shift_limit: 0.0
    scale_limit: 0.0
    elastic_transform: false
    gamma_transform: false
    gaussian_noise: false
    blur: false
    mixup:
      enabled: false
      alpha: 0.2
      prob: 0.5
  valid:
    image_size: 512
    horizontal_flip: 0.0
    vertical_flip: 0.0
