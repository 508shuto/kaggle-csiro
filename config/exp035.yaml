experiment:
  name: exp035
  seed: 42

dataset:
  input_dir: ./input
  output_dir: ./output
  n_folds: 5
  shuffle: true

model:
  name: "vit_large_patch16_dinov3.lvd1689m"
  pretrained: true
  in_channels: 3
  freeze_backbone: true

loss:
  name: "smooth_l1_loss"
  params: {}

aux_loss:
  name: "aux_loss"
  params: {}
  weight: 0.1

trainer:
  train:
    epochs: 100
    warmup_epochs: 3
    batch_size: 4  # 1024x1024入力のためメモリ考慮で削減
    num_workers: 4
    pin_memory: true
    drop_last: true
    prefetch_factor: 2
    patience: null
    device_type: "auto"
    devices: 1
    precision: "16-mixed"
    accumulate_grad_batches: 4  # effective batch size = 16
    val_check_interval: 1.0
    strategy: "auto"
    deterministic: true
    optimizer:
      opt: "adamw"
      lr: 1e-3  # ヘッドのみ学習なのでlrを上げる
      weight_decay: 1e-2
      betas: [0.9, 0.999]
      eps: 1e-8
      amsgrad: false
    scheduler:
      sched: "cosine"
    ema:
      decay: 0.995
      update_after_step: 0
    use_wandb: true
  valid:
    batch_size: 4  # 1024x1024入力のためメモリ考慮で削減
    num_workers: 4
    pin_memory: false
    drop_last: false
    prefetch_factor: 2

augmentation:
  train:
    image_size: 1024  # 高解像度入力（モデル内で512に縮小＋タイル分割）
    horizontal_flip: 0.5
    vertical_flip: 0.5
    rotation_limit: 20
    shift_limit: 0.1
    scale_limit: 0.2
    elastic_transform: 0.2
    brightness_contrast: 0.2
    gamma_transform: 0.2
    gaussian_noise: 0.2
    blur: 0.2
    mixup:
      enabled: false  # multiscaleとの相性が悪いため無効化（PR #18 指摘対応）
      alpha: 0.2
      prob: 0.5
  valid:
    image_size: 1024  # 高解像度入力
    horizontal_flip: 0.0
    vertical_flip: 0.0
