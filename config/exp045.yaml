experiment:
  name: exp045
  seed: 1129  # exp043/044から継続

dataset:
  input_dir: ./input
  output_dir: ./output
  n_folds: 3  # 3-fold CV
  shuffle: true

model:
  name: "Qwen/Qwen3-VL-2B-Instruct"
  pretrained: true
  in_channels: 3
  hidden_size: 1536  # Qwen3-VL-2B visual hidden size
  freeze_encoder: true  # Encoder凍結、Headのみ学習

loss:
  name: "smooth_l1_loss"
  params: {}

aux_loss:
  name: "aux_loss"
  params: {}
  weight: 0.1

trainer:
  train:
    epochs: 30
    warmup_epochs: 3
    batch_size: 16
    num_workers: 4
    pin_memory: true
    drop_last: true
    patience: null
    device_type: "auto"
    devices: 1
    precision: "bf16-mixed"  # Qwen3-VLはbf16推奨
    accumulate_grad_batches: 1
    val_check_interval: 1.0
    strategy: "auto"
    deterministic: true
    optimizer:
      lr: 1e-3  # Head学習のみなので高めのlr
      weight_decay: 1e-2
    ema:
      decay: 0.995
      update_after_step: 0
    use_wandb: true
  valid:
    batch_size: 16
    num_workers: 4
    pin_memory: false
    drop_last: false

augmentation:
  train:
    image_size: 384  # Qwen3-VL推奨サイズ
  valid:
    image_size: 384
