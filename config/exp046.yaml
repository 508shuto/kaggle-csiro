experiment:
  name: exp046
  seed: 1129

dataset:
  input_dir: ./input
  output_dir: ./output
  n_folds: 3
  shuffle: true

model:
  name: "Qwen/Qwen3-VL-2B-Instruct"
  pretrained: true
  out_channels: 3  # [clover, dead, green]
  hidden_size: 1536  # Qwen3-VL-2B visual hidden size
  freeze_encoder: true

loss:
  name: "smooth_l1_loss"
  params: {}

aux_loss:
  name: "aux_loss"
  params: {}
  weight: 0.1

trainer:
  train:
    epochs: 30
    warmup_epochs: 3
    batch_size: 16
    num_workers: 4
    pin_memory: true
    drop_last: true
    patience: null
    device_type: "auto"
    devices: 1
    precision: "bf16-mixed"
    accumulate_grad_batches: 1
    val_check_interval: 1.0
    strategy: "auto"
    deterministic: true
    optimizer:
      lr: 1e-3
      weight_decay: 1e-2
    ema:
      decay: 0.995
      update_after_step: 0
    use_wandb: true
  valid:
    batch_size: 16
    num_workers: 4
    pin_memory: false
    drop_last: false

augmentation:
  train:
    image_size: 384
  valid:
    image_size: 384
