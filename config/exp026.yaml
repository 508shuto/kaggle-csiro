experiment:
  name: exp026
  seed: 42

dataset:
  input_dir: ./input
  output_dir: ./output
  n_folds: 5
  shuffle: true

model:
  name: "Qwen/Qwen3-VL-2B-Instruct"
  pretrained: true
  freeze_backbone: true
  hidden_dim: 1536  # Qwen3-VL-2B hidden dimension
  head_hidden_dim: 256
  dropout: 0.2

loss:
  name: "smooth_l1_loss"
  params: {}

aux_loss:
  name: "aux_loss"
  params: {}
  weight: 0.1

trainer:
  train:
    lr: 1e-4
    weight_decay: 1e-4
    epochs: 100
    warmup_epochs: 5
    batch_size: 8  # Smaller batch size for VLM
    num_workers: 4
    pin_memory: true
    drop_last: true
    prefetch_factor: 2
    patience: null
    device_type: "auto"
    devices: 1
    precision: "bf16-mixed"  # Use bfloat16 for VLM
    accumulate_grad_batches: 2  # Gradient accumulation to compensate smaller batch
    val_check_interval: 1.0
    strategy: "auto"
    deterministic: true
    optimizer:
      opt: "adamw"
      lr: 1e-4
      weight_decay: 1e-2
      betas: [0.9, 0.999]
      eps: 1e-8
      amsgrad: false
    scheduler:
      sched: "cosine"
    ema:
      decay: 0.995
      update_after_step: 0
    use_wandb: true
  valid:
    batch_size: 16
    num_workers: 4
    pin_memory: false
    drop_last: false
    prefetch_factor: 2

augmentation:
  train:
    image_size: 384  # Qwen3-VL default size
    horizontal_flip: 0.5
    vertical_flip: 0.5
    rotation_limit: 20
    shift_limit: 0.1
    scale_limit: 0.2
    elastic_transform: false  # Disable for VLM
    brightness_contrast: true
    gamma_transform: false
    gaussian_noise: false
    blur: false
    mixup:
      enabled: true
      alpha: 0.2
      prob: 0.5
  valid:
    image_size: 384
    horizontal_flip: 0.0
    vertical_flip: 0.0
