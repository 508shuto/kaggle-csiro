name: Ruff Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run ruff linter
        uses: chartboost/ruff-action@v1
        with:
          version: 0.14.2

      - name: Run ruff formatter check
        uses: chartboost/ruff-action@v1
        with:
          version: 0.14.2
          args: "format --check"
